<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Olá, eu sou o Vitor.</title>
  <desc id="d">Desenvolvedor Full-Stack: Next.js, TypeScript, Node.js, C# e React Native.</desc>
  <defs>
    <style>
      .sans{font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif}
      .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Liberation Mono',Menlo,monospace}
      .cursor{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(160 40) scale(640 380)">
      <stop offset="0" stop-color="#ffff00" stop-opacity=".09"/>
      <stop offset="1" stop-color="#ffff00" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="1200" height="360" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="#121212"/>
    <rect width="1200" height="360" fill="url(#glow)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="359" rx="23.5" fill="none" stroke="#2a2a2a"/>

  <g class="mono">
    <rect x="64" y="50" width="190" height="34" rx="17" fill="#1c1c1c" stroke="#353535"/>
    <text x="84" y="72" font-size="15" fill="#9a9a9a" xml:space="preserve">~/vitor $ <tspan fill="#f8f9fa">whoami</tspan></text>
  </g>

  <text class="sans" x="62" y="160" font-size="58" font-weight="800" fill="#f8f9fa">Olá, eu sou o Vitor<tspan fill="#ffff00">.</tspan></text>

  <text class="mono" x="64" y="212" font-size="22" fill="#f8f9fa" xml:space="preserve"><tspan fill="#ffff00">&gt;</tspan> desenvolvedor full-stack<tspan class="cursor" fill="#ffff00">_</tspan></text>

  <text class="mono" x="64" y="254" font-size="17" fill="#9a9a9a">next.js · typescript · node.js · c# · react native</text>

  <text class="mono" x="64" y="306" font-size="14" fill="#6b6b6b">santa maria, rs · brasil</text>

  <g transform="translate(760 56)">
    <rect width="380" height="248" rx="14" fill="#181818" stroke="#353535"/>
    <circle cx="24" cy="24" r="6" fill="#ff5f57"/>
    <circle cx="44" cy="24" r="6" fill="#febc2e"/>
    <circle cx="64" cy="24" r="6" fill="#28c840"/>
    <text class="mono" x="356" y="29" font-size="13" fill="#7a7a7a" text-anchor="end">vitor.ts</text>
    <line x1="1" y1="46" x2="379" y2="46" stroke="#2a2a2a"/>
    <g class="mono" font-size="14" fill="#9a9a9a">
      <text x="24" y="82" xml:space="preserve"><tspan fill="#ffff00">const</tspan> <tspan fill="#f8f9fa">vitor</tspan> = {</text>
      <text x="24" y="110" xml:space="preserve">  <tspan fill="#f8f9fa">cargo</tspan>: <tspan fill="#c3e88d">"Full-Stack"</tspan>,</text>
      <text x="24" y="138" xml:space="preserve">  <tspan fill="#f8f9fa">agora</tspan>: <tspan fill="#c3e88d">"Forza Clubes"</tspan>,</text>
      <text x="24" y="166" xml:space="preserve">  <tspan fill="#f8f9fa">stack</tspan>: [<tspan fill="#c3e88d">"Next.js"</tspan>, <tspan fill="#c3e88d">"C#"</tspan>, <tspan fill="#c3e88d">"Node.js"</tspan>],</text>
      <text x="24" y="194" xml:space="preserve">  <tspan fill="#f8f9fa">desde</tspan>: <tspan fill="#f78c6c">2022</tspan>,</text>
      <text x="24" y="222" xml:space="preserve">};</text>
    </g>
  </g>
</svg>
